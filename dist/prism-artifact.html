// components.js — shared UI helpers. May touch DOM; never touches the kernel's
// internals beyond reading the model.


function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtMoney(v, currency = 'SAR') {
  if (v === undefined || v === null) return 'N/A';
  const abs = Math.abs(v);
  const s = abs >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : abs >= 1e3 ? (v / 1e3).toFixed(0) + 'k' : v.toFixed(0);
  return `${s} ${currency}`;
}

function fmtRatio(v) {
  return v === undefined || v === null ? null : v.toFixed(2);
}

function fmtPct(v, digits = 1) {
  return v === undefined || v === null ? null : (v * 100).toFixed(digits) + '%';
}

// The non-negotiable: a missing value renders as an explicit N/A with a
// reason, never a placeholder zero.
function naTag(reason) {
  return `<span class="na-tag" title="${esc(reason)}">N/A — ${esc(reason)}</span>`;
}

function valueOrNA(formatted, reason) {
  return formatted === null || formatted === undefined ? naTag(reason || 'not in file') : `<span class="num">${esc(formatted)}</span>`;
}

function statusPill(status) {
  const label = { pass: 'pass', fail: 'fail', warn: 'warn', na: 'n/a', info: 'info' }[status] || status;
  return `<span class="pill ${esc(status)}">${esc(label)}</span>`;
}

const reducedMotion = () =>
  window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Count-up for KPI numbers. Renders the final string immediately for
// reduced-motion users; nothing downstream may depend on intermediate frames.
function countUp(el, target, format = (v) => String(Math.round(v)), duration = 550) {
  if (reducedMotion() || !Number.isFinite(target)) { el.textContent = format(target); return; }
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min((t - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = format(target * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function statTile({ label, value, note, tone, id }) {
  return `<button class="stat" data-stat="${esc(id)}">
    <div class="label">${esc(label)}</div>
    <div class="value ${esc(tone || '')}">${value}</div>
    ${note ? `<div class="note">${note}</div>` : ''}
  </button>`;
}

function taskLine(t) {
  return `<span class="num">${esc(t.code)}</span> ${esc(t.name)}`;
}

function taskModalBody(t, model) {
  const rows = [
    ['Status', { TK_NotStart: 'Not started', TK_Active: 'In progress', TK_Complete: 'Complete' }[t.status] || t.status],
    ['WBS', esc(model.wbsById.get(t.wbsId)?.name || t.wbsId)],
    ['Planned', `<span class="num">${fmtDate(t.targetStart)} → ${fmtDate(t.targetEnd)}</span>`],
    ['Actual', t.actStart !== undefined
      ? `<span class="num">${fmtDate(t.actStart)} → ${t.actEnd !== undefined ? fmtDate(t.actEnd) : 'in progress'}</span>`
      : naTag('no actual start recorded')],
    ['Duration', t.origDays !== undefined ? `<span class="num">${t.origDays} wd</span>` : naTag('target dates missing')],
    ['Total float', t.totalFloatHrs !== undefined ? `<span class="num">${(t.floatDays).toFixed(1)} wd</span>` : naTag('not populated (typical for completed work)')],
    ['Physical %', t.physPct !== undefined ? `<span class="num">${t.physPct}%</span>` : naTag('not recorded')],
    ['Budget', `<span class="num">${esc(fmtMoney(t.targetCost))}</span>`],
    ['Actual cost', t.actualCost ? `<span class="num">${esc(fmtMoney(t.actualCost))}</span>` : naTag('no actuals booked')],
    ['Constraint', t.cstrType ? `<span class="num">${esc(t.cstrType)} ${fmtDate(t.cstrDate)}</span>` : 'none'],
    ['Chainage', t.chainage !== null ? `<span class="num">KP ${t.chainage.toFixed(3)}</span>` : naTag('no KP pattern in code/name')],
    ['Calendar', esc(t.cal.name)],
  ];
  return `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

// ---------- canvas plumbing ----------

// Sizes a canvas to its box at devicePixelRatio and calls draw(ctx, w, h).
// Returns a redraw function; re-runs on resize.
function mountCanvas(canvas, heightPx, draw) {
  const render = () => {
    const w = canvas.clientWidth || canvas.parentElement.clientWidth || 600;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.height = heightPx + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(heightPx * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, heightPx);
    draw(ctx, w, heightPx);
  };
  const ro = new ResizeObserver(() => render());
  ro.observe(canvas.parentElement);
  requestAnimationFrame(render);
  return render;
}

function chartTip(box) {
  let tip = box.querySelector('.chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    box.appendChild(tip);
  }
  return {
    show(html, x, y) {
      tip.innerHTML = html;
      tip.style.display = 'block';
      const bw = box.clientWidth;
      tip.style.left = Math.min(x + 14, bw - tip.offsetWidth - 6) + 'px';
      tip.style.top = Math.max(y - tip.offsetHeight - 10, 4) + 'px';
    },
    hide() { tip.style.display = 'none'; },
  };
}

// Hidden, screen-reader-exposed table beside every canvas chart — canvas has
// no accessibility tree.
function a11yTable(caption, headers, rows) {
  return `<div class="visually-hidden"><table>
    <caption>${esc(caption)}</caption>
    <thead><tr>${headers.map((h) => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function ringSVG(pct, color, size = 52) {
  const r = (size - 6) / 2;
  const c = 2 * Math.PI * r;
  const filled = pct === null || pct === undefined ? 0 : Math.min(Math.max(pct, 0), 1);
  return `<svg width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--raised-2)" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${(filled * c).toFixed(1)} ${c.toFixed(1)}"/>
  </svg>`;
}

// ---------- reporting window ----------

function isoDate(ms) {
  if (ms === undefined || ms === null) return '';
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
}

function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : undefined;
}

const WIN_PRESETS = [
  ['back1w', 'Last week'], ['back2w', 'Last 2 wk'], ['back4w', 'Last 4 wk'],
  ['month', 'This month'], ['next2w', 'Next 2 wk'], ['next4w', 'Next 4 wk'],
  ['next6w', 'Next 6 wk'], ['full', 'Full plan'],
];

// One shared control: presets are data-date-relative, plus custom from/to and
// ◀ ▶ stepping by the window's own length.
function windowBarHTML(store) {
  const w = store.win;
  return `<div class="winbar">
    <div class="winpresets">
      ${WIN_PRESETS.map(([id, label]) => `<button class="winpreset ${w.preset === id ? 'active' : ''}" data-preset="${id}">${label}</button>`).join('')}
    </div>
    <div class="winrange">
      <button class="btn small" data-step="-1" title="Shift window back">◀</button>
      <input type="date" data-win-from value="${isoDate(w.from)}" aria-label="Window from">
      <span style="color:var(--dim-2)">→</span>
      <input type="date" data-win-to value="${isoDate(w.to)}" aria-label="Window to">
      <button class="btn small" data-step="1" title="Shift window forward">▶</button>
    </div>
  </div>`;
}

function wireWindowBar(el, store) {
  el.querySelectorAll('[data-preset]').forEach((b) =>
    b.addEventListener('click', () => store.setWindowPreset(b.dataset.preset)));
  el.querySelectorAll('[data-step]').forEach((b) =>
    b.addEventListener('click', () => store.stepWindow(+b.dataset.step)));
  const from = el.querySelector('[data-win-from]');
  const to = el.querySelector('[data-win-to]');
  const custom = () => {
    const f = parseISO(from.value), t = parseISO(to.value);
    if (f !== undefined && t !== undefined && t >= f) store.setWindow(f, t, 'custom');
  };
  from.addEventListener('change', custom);
  to.addEventListener('change', custom);
}

// ---------- CSV export (planners live in Excel) ----------

function downloadCSV(filename, headers, rows) {
  const cell = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const text = [headers, ...rows].map((r) => r.map(cell).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function csvButton(label = 'Export CSV') {
  return `<button class="btn small" data-csv>${label}</button>`;
}

function offenderListHTML(offenders, model, cap = 24) {
  if (!offenders || offenders.length === 0) return '<p class="sub" style="color:var(--dim)">No offending items.</p>';
  const names = offenders.slice(0, cap).map((id) => {
    const t = model.taskById.get(id);
    return `<li>${esc(t ? t.code : id)}</li>`;
  }).join('');
  const more = offenders.length > cap ? `<li>… and ${offenders.length - cap} more</li>` : '';
  return `<ul class="offender-list">${names}${more}</ul>`;
}

// Command — the Observatory. A radial chronometer (the plan span as a ring,
// activities as concentric arcs per WBS band, the data date as a needle) and
// a constellation map (activities as stars on time × chainage, relationships
// as hairlines). Both canvases are hit-tested: every arc and star opens the
// real task modal. All numbers remain the kernel's — the exotic skin never
// invents data.




const TAU = Math.PI * 2;

function cssVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function planSpan(m) {
  let t0 = Infinity, t1 = 0;
  for (const t of m.tasks) {
    if (t.targetStart !== undefined) t0 = Math.min(t0, t.targetStart);
    if (t.targetEnd !== undefined) t1 = Math.max(t1, t.targetEnd);
  }
  return [t0, t1];
}

// ---------- the chronometer dial ----------
function drawDial(ctx, w, h, m, bands, hits) {
  hits.length = 0;
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) / 2 - 26;
  const [t0, t1] = planSpan(m);
  if (!Number.isFinite(t0) || t1 <= t0) return;
  const ang = (ms) => -Math.PI / 2 + ((ms - t0) / (t1 - t0)) * TAU;

  // month ring + ticks
  ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R + 14, 0, TAU); ctx.stroke();
  ctx.font = '9px ' + cssVar('--mono');
  const d0 = new Date(dayFloor(t0));
  let mth = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1);
  while (mth < t1) {
    const a = ang(mth);
    const x1 = cx + Math.cos(a) * (R + 10), y1 = cy + Math.sin(a) * (R + 10);
    const x2 = cx + Math.cos(a) * (R + 18), y2 = cy + Math.sin(a) * (R + 18);
    ctx.strokeStyle = cssVar('--dim-2');
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const md = new Date(mth);
    if (md.getUTCMonth() % 2 === 0) {
      ctx.fillStyle = cssVar('--dim-2');
      const lx = cx + Math.cos(a) * (R + 24), ly = cy + Math.sin(a) * (R + 24);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${String(md.getUTCMonth() + 1).padStart(2, '0')}/${String(md.getUTCFullYear()).slice(2)}`, lx, ly);
    }
    mth = Date.UTC(md.getUTCFullYear(), md.getUTCMonth() + 1, 1);
  }

  // WBS bands: concentric arcs, outermost = first band
  const rInner = R * 0.34;
  const bandW = (R - rInner) / Math.max(bands.length, 1);
  bands.forEach((band, bi) => {
    const r = R - bi * bandW - bandW / 2;
    // faint orbit line
    ctx.strokeStyle = 'rgba(76,88,113,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    for (const t of band.tasks) {
      if (t.targetStart === undefined || t.targetEnd === undefined) continue;
      const a0 = ang(t.targetStart), a1 = Math.max(ang(t.targetEnd), a0 + 0.012);
      const crit = t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete';
      ctx.lineWidth = Math.max(bandW * 0.5, 3);
      ctx.lineCap = 'round';
      if (crit) {
        ctx.strokeStyle = 'rgba(255,111,102,.28)'; ctx.lineWidth += 4;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
        ctx.lineWidth -= 4;
      }
      ctx.strokeStyle = crit ? cssVar('--bad')
        : t.status === 'TK_Complete' ? 'rgba(38,165,161,.85)'
        : t.status === 'TK_Active' ? cssVar('--accent')
        : 'rgba(76,88,113,.6)';
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (t.milestone) {
        const mx = cx + Math.cos(a0) * r, my = cy + Math.sin(a0) * r;
        ctx.fillStyle = crit ? cssVar('--bad') : cssVar('--text');
        ctx.beginPath(); ctx.arc(mx, my, 2.6, 0, TAU); ctx.fill();
      }
      hits.push({ kind: 'arc', t, r, a0, a1, tol: Math.max(bandW * 0.4, 5) });
    }
  });

  // data-date needle
  if (m.dataDate !== undefined && m.dataDate >= t0 && m.dataDate <= t1) {
    const a = ang(m.dataDate);
    const nx = cx + Math.cos(a) * (R + 8), ny = cy + Math.sin(a) * (R + 8);
    ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 1.2;
    ctx.shadowColor = cssVar('--accent'); ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * rInner * 0.6, cy + Math.sin(a) * rInner * 0.6); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.arc(nx, ny, 3, 0, TAU); ctx.fillStyle = cssVar('--accent'); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // center readout
  ctx.textAlign = 'center';
  ctx.fillStyle = cssVar('--text');
  ctx.font = '300 30px ' + cssVar('--mono');
  ctx.fillText(window.__prismDialCenter || '', cx, cy - 2);
  ctx.fillStyle = cssVar('--dim-2');
  ctx.font = '9px ' + cssVar('--mono');
  ctx.fillText('E A R N E D', cx, cy + 18);
  ctx.textAlign = 'left';
}

// ---------- the constellation map ----------
function drawConstellation(ctx, w, h, m, hits) {
  hits.length = 0;
  const pad = { l: 56, r: 14, t: 14, b: 24 };
  const [t0, t1] = planSpan(m);
  if (!Number.isFinite(t0) || t1 <= t0) return;
  const kps = m.tasks.filter((t) => t.chainage !== null).map((t) => t.chainage);
  const kpMin = Math.min(...kps), kpMax = Math.max(...kps);
  const noKp = m.tasks.filter((t) => t.chainage === null && t.targetStart !== undefined);
  const X = (ms) => pad.l + ((ms - t0) / (t1 - t0)) * (w - pad.l - pad.r);
  const laneH = 16;
  const topBand = noKp.length ? Math.min(noKp.length, 6) * laneH + 10 : 0;
  const Y = (t, i) => {
    if (t.chainage !== null && kpMax > kpMin) {
      return pad.t + topBand + ((t.chainage - kpMin) / (kpMax - kpMin)) * (h - pad.t - pad.b - topBand - 8);
    }
    return pad.t + (i % 6) * laneH + 6;
  };
  const pos = new Map();
  let idx = 0;
  for (const t of m.tasks) {
    if (t.targetStart === undefined || t.targetEnd === undefined) continue;
    const mid = (t.targetStart + t.targetEnd) / 2;
    pos.set(t.id, { x: X(mid), y: Y(t, t.chainage === null ? idx++ : 0), t });
  }

  // KP gridlines
  ctx.font = '9px ' + cssVar('--mono');
  if (kps.length && kpMax > kpMin) {
    for (let kp = Math.ceil(kpMin / 6) * 6; kp <= kpMax; kp += 6) {
      const y = pad.t + topBand + ((kp - kpMin) / (kpMax - kpMin)) * (h - pad.t - pad.b - topBand - 8);
      ctx.strokeStyle = 'rgba(34,48,73,.4)';
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.fillStyle = cssVar('--dim-2');
      ctx.fillText(`KP${kp}`, 8, y + 3);
    }
  }
  // time ticks (quarters)
  const q0 = new Date(dayFloor(t0));
  let q = Date.UTC(q0.getUTCFullYear(), Math.floor(q0.getUTCMonth() / 3) * 3 + 3, 1);
  while (q < t1) {
    const x = X(q);
    ctx.strokeStyle = 'rgba(34,48,73,.35)';
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
    const qd = new Date(q);
    ctx.fillStyle = cssVar('--dim-2');
    ctx.fillText(`${String(qd.getUTCMonth() + 1).padStart(2, '0')}/${String(qd.getUTCFullYear()).slice(2)}`, x - 12, h - 9);
    q = Date.UTC(qd.getUTCFullYear(), qd.getUTCMonth() + 3, 1);
  }

  // relationship hairlines
  for (const p of m.preds) {
    const a = pos.get(p.predTaskId), b = pos.get(p.taskId);
    if (!a || !b) continue;
    const critLink = [a.t, b.t].every((t) => t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete');
    ctx.strokeStyle = critLink ? 'rgba(255,111,102,.4)' : 'rgba(110,231,226,.1)';
    ctx.lineWidth = critLink ? 1.1 : 0.7;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // stars
  for (const { x, y, t } of pos.values()) {
    const crit = t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete';
    const rad = Math.max(Math.sqrt((t.targetCost || 40000) / 1e6) * 3.4, 2.2);
    const color = crit ? cssVar('--bad')
      : t.status === 'TK_Complete' ? 'rgba(38,165,161,.9)'
      : t.status === 'TK_Active' ? cssVar('--accent')
      : 'rgba(139,151,173,.65)';
    if (crit || t.status === 'TK_Active') {
      ctx.shadowColor = color; ctx.shadowBlur = 10;
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    if (t.milestone) {
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, rad + 3, 0, TAU); ctx.stroke();
    }
    hits.push({ kind: 'star', t, x, y, tol: rad + 5 });
  }

  // data-date scan line
  if (m.dataDate !== undefined && m.dataDate > t0 && m.dataDate < t1) {
    const x = X(m.dataDate);
    const grad = ctx.createLinearGradient(x - 26, 0, x, 0);
    grad.addColorStop(0, 'rgba(110,231,226,0)');
    grad.addColorStop(1, 'rgba(110,231,226,.10)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - 26, pad.t, 26, h - pad.t - pad.b);
    ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = cssVar('--accent');
    ctx.fillText('DATA DATE', x + 5, pad.t + 9);
  }
}

function wireCanvasHits(canvas, box, m, hits, isDial) {
  const tip = chartTip(box);
  const find = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (isDial) {
      const cx = rect.width / 2, cy = rect.height / 2;
      const dx = mx - cx, dy = my - cy;
      const r = Math.hypot(dx, dy);
      let a = Math.atan2(dy, dx);
      for (const hh of hits) {
        if (Math.abs(r - hh.r) > hh.tol) continue;
        let aa = a;
        while (aa < hh.a0) aa += TAU;
        if (aa <= hh.a1 + 0.02) return hh;
      }
      return null;
    }
    let best = null, bestD = Infinity;
    for (const hh of hits) {
      const d = Math.hypot(mx - hh.x, my - hh.y);
      if (d <= hh.tol && d < bestD) { best = hh; bestD = d; }
    }
    return best;
  };
  canvas.addEventListener('mousemove', (e) => {
    const hit = find(e);
    canvas.style.cursor = hit ? 'pointer' : 'default';
    if (!hit) { tip.hide(); return; }
    const rect = canvas.getBoundingClientRect();
    const t = hit.t;
    tip.show(`<span class="num">${esc(t.code)}</span> ${esc(t.name.slice(0, 38))}<br>` +
      `<b>${fmtDate(t.targetStart)} → ${fmtDate(t.targetEnd)}</b>` +
      (t.chainage !== null ? `<br>KP <b>${t.chainage.toFixed(1)}</b>` : ''),
      e.clientX - rect.left, e.clientY - rect.top);
  });
  canvas.addEventListener('mouseleave', () => tip.hide());
  canvas.addEventListener('click', (e) => {
    const hit = find(e);
    if (hit) openModal(`${hit.t.code} — ${hit.t.name}`, 'telemetry detail', taskModalBody(hit.t, m));
  });
}

const ViewCommand = {
  id: 'command', title: 'Observatory', group: 'Overview',
  chip(store) {
    const m = store.model;
    return m ? `as of <span class="num">${fmtDate(m.dataDate)}</span>` : '';
  },
  render(el, store) {
    const m = store.model;
    const { evm, dcma } = store.d;
    const critical = m.tasks.filter((t) => t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete');
    const dcmaPass = dcma.filter((c) => c.status === 'pass').length;
    const dcmaNA = dcma.filter((c) => c.status === 'na').length;
    const spiTone = evm.spi.value === null ? '' : evm.spi.value >= 0.95 ? 'good' : evm.spi.value >= 0.85 ? 'warn' : 'bad';
    const cpiTone = evm.cpi.value === null ? '' : evm.cpi.value >= 0.95 ? 'good' : evm.cpi.value >= 0.85 ? 'warn' : 'bad';

    // dial bands: level-1 WBS nodes that carry tasks in their subtree
    const bands = [];
    const gather = (node) => {
      const out = [...node.tasks];
      for (const c of node.children) out.push(...gather(c));
      return out;
    };
    for (const child of m.wbsRoot.children) {
      const tasks = gather(child);
      if (tasks.length) bands.push({ name: child.name, tasks });
    }
    if (!bands.length) bands.push({ name: m.wbsRoot.name, tasks: m.tasks });
    window.__prismDialCenter = evm.earnedPct !== undefined ? (evm.earnedPct * 100).toFixed(1) + '%' : '—';

    el.innerHTML = `
      <div class="banner">
        <b>${esc(store.modelName)}</b>
        <span>data date ${fmtDate(m.dataDate)} · <span class="num">${esc(m.dataDateSource || 'n/a')}</span></span>
        ${store.baseline ? `<span>baseline <b>${esc(store.baselineName)}</b></span>` : `<span>${naTag('no baseline loaded — compare & 3 DCMA checks unavailable')}</span>`}
      </div>

      <div class="section">
        <h2>Observatory</h2>
        <p class="sub">The plan span as one revolution; each orbit is a WBS band, each arc an activity. The needle is the data date. Hover to read, click to open — arcs and stars are live.</p>
        <div class="observatory">
          <div class="dialbox chartbox"><canvas></canvas></div>
          <div class="readouts">
            <div class="statrow">
              ${statTile({ id: 'acts', label: 'Activities', value: '<span data-count="acts">0</span>', note: `${m.preds.length} relationships` })}
              ${statTile({ id: 'crit', label: 'Critical', value: `<span data-count="crit">0</span>`, note: 'float ≤ 0, incomplete', tone: critical.length ? 'bad' : 'good' })}
            </div>
            <div class="statrow">
              ${statTile({ id: 'spi', label: 'SPI', value: valueOrNA(fmtRatio(evm.spi.value), evm.spi.reason), tone: spiTone, note: 'EV ÷ PV at data date' })}
              ${statTile({ id: 'cpi', label: 'CPI', value: valueOrNA(fmtRatio(evm.cpi.value), evm.cpi.reason), tone: cpiTone, note: 'EV ÷ AC' })}
            </div>
            <div class="statrow">
              ${statTile({ id: 'earned', label: '% Earned', value: valueOrNA(fmtPct(evm.earnedPct), 'no costs in file'), note: `of ${fmtMoney(evm.bac)} BAC` })}
              ${statTile({ id: 'dcma', label: 'DCMA', value: `<span class="num">${dcmaPass}/${14 - dcmaNA}</span>`, note: dcmaNA ? `${dcmaNA} not computable` : 'all computable', tone: dcmaPass >= 10 ? 'good' : 'warn' })}
            </div>
          </div>
        </div>
        ${a11yTable('Activities by WBS band', ['Band', 'Activities'], bands.map((b) => [b.name, b.tasks.length]))}
      </div>

      <div class="section">
        <h2>Constellation</h2>
        <p class="sub">Every activity as a star — time across, chainage down (unchainaged work rides the top lanes). Hairlines are relationships; the red thread is the critical chain. Click a star for its telemetry.</p>
        <div class="chartbox"><canvas data-map></canvas></div>
        <div class="legend">
          <span><i class="dot" style="background:rgba(38,165,161,.9)"></i>complete</span>
          <span><i class="dot" style="background:var(--accent)"></i>in progress</span>
          <span><i class="dot" style="background:rgba(139,151,173,.65)"></i>not started</span>
          <span><i class="dot" style="background:var(--bad)"></i>critical</span>
        </div>
        ${a11yTable('Activity constellation', ['Code', 'Activity', 'Start', 'Finish', 'KP', 'Status'],
          m.tasks.map((t) => [t.code, t.name, fmtDate(t.targetStart), fmtDate(t.targetEnd),
            t.chainage !== null ? t.chainage.toFixed(1) : 'n/a', t.status]))}
      </div>

      <div class="section">
        <h2>Tables parsed</h2>
        <p class="sub">Raw parse sanity — one in-memory model feeds every view.</p>
        <div class="tablewrap"><table class="ledger">
          <thead><tr><th>Table</th><th class="num">Rows</th><th>Fields present</th></tr></thead>
          <tbody>
            ${m.tablesSummary.map((t) => `<tr class="rowlink" data-table="${esc(t.name)}" tabindex="0">
              <td class="num">${esc(t.name)}</td><td class="num">${t.rows}</td>
              <td style="color:var(--dim)">${esc(Object.keys((m.raw[t.name] || [])[0] || {}).slice(0, 6).join(', '))}${Object.keys((m.raw[t.name] || [])[0] || {}).length > 6 ? '…' : ''}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>`;

    countUp(el.querySelector('[data-count="acts"]'), m.tasks.length, (v) => String(Math.round(v)));
    countUp(el.querySelector('[data-count="crit"]'), critical.length, (v) => String(Math.round(v)));

    const dialCanvas = el.querySelector('.dialbox canvas');
    const dialHits = [];
    const dialSize = Math.min(460, Math.max(dialCanvas.parentElement.clientWidth || 420, 300));
    mountCanvas(dialCanvas, dialSize, (ctx, w, h) => drawDial(ctx, w, h, m, bands, dialHits));
    wireCanvasHits(dialCanvas, dialCanvas.parentElement, m, dialHits, true);

    const mapCanvas = el.querySelector('[data-map]');
    const mapHits = [];
    mountCanvas(mapCanvas, 340, (ctx, w, h) => drawConstellation(ctx, w, h, m, mapHits));
    wireCanvasHits(mapCanvas, mapCanvas.parentElement, m, mapHits, false);

    const statModals = {
      acts: () => openModal('Activities', `${m.tasks.length} in file`, `
        <dl>
          <dt>Total</dt><dd class="num">${m.tasks.length}</dd>
          <dt>Complete</dt><dd class="num">${m.tasks.filter((t) => t.status === 'TK_Complete').length}</dd>
          <dt>In progress</dt><dd class="num">${m.tasks.filter((t) => t.status === 'TK_Active').length}</dd>
          <dt>Not started</dt><dd class="num">${m.tasks.filter((t) => t.status === 'TK_NotStart').length}</dd>
          <dt>Milestones</dt><dd class="num">${m.tasks.filter((t) => t.milestone).length}</dd>
          <dt>Relationships</dt><dd class="num">${m.preds.length}</dd>
        </dl>`),
      spi: () => openModal('Schedule Performance Index', 'EVM per PMI/AACE convention', `
        <kbd class="formula">SPI = EV ÷ PV at the data date = ${fmtMoney(evm.ev)} ÷ ${evm.pvAtDD !== undefined ? fmtMoney(evm.pvAtDD) : 'N/A'}</kbd>
        <p>${evm.spi.value === null ? esc(evm.spi.reason) : `The project has earned <b class="num">${fmtPct(evm.ev / evm.bac)}</b> of BAC against <b class="num">${fmtPct(evm.pvAtDD / evm.bac)}</b> planned by ${fmtDate(m.dataDate)}.`}</p>
        <p style="color:var(--dim);font-size:12.5px">EV and AC are single points at the data date — one XER file carries one snapshot of actuals, so no EV/AC history is shown anywhere in this tool.</p>`),
      cpi: () => openModal('Cost Performance Index', 'EVM per PMI/AACE convention', `
        <kbd class="formula">CPI = EV ÷ AC = ${fmtMoney(evm.ev)} ÷ ${fmtMoney(evm.ac)}</kbd>
        <dl>
          <dt>BAC</dt><dd class="num">${fmtMoney(evm.bac)}</dd>
          <dt>EAC</dt><dd>${evm.eac !== undefined ? `<span class="num">${fmtMoney(evm.eac)}</span>` : naTag('CPI not computable')}</dd>
          <dt>ETC</dt><dd>${evm.etc !== undefined ? `<span class="num">${fmtMoney(evm.etc)}</span>` : naTag('CPI not computable')}</dd>
          <dt>VAC</dt><dd>${evm.vac !== undefined ? `<span class="num">${fmtMoney(evm.vac)}</span>` : naTag('CPI not computable')}</dd>
          <dt>TCPI</dt><dd>${evm.tcpi !== undefined ? `<span class="num">${evm.tcpi.toFixed(2)}</span>` : naTag('BAC = AC')}</dd>
        </dl>`),
      earned: () => openModal('% Earned', 'cost-weighted, at the data date', `
        <kbd class="formula">Σ(activity cost × earned %) ÷ Σ(activity cost), earned % from phys_complete_pct (÷100) or schedule-elapsed, 0 for unstarted work</kbd>
        <dl><dt>EV</dt><dd class="num">${fmtMoney(evm.ev)}</dd><dt>BAC</dt><dd class="num">${fmtMoney(evm.bac)}</dd></dl>`),
      crit: () => openModal('Critical activities', 'total float ≤ 0, not complete', critical.length
        ? `<ul class="offender-list">${critical.map((t) => `<li>${esc(t.code)}</li>`).join('')}</ul>`
        : '<p>No activities with float ≤ 0.</p>'),
      dcma: () => openModal('DCMA 14-Point Assessment', `${dcmaPass} pass of ${14 - dcmaNA} computable`, `
        <div class="tablewrap"><table class="ledger"><tbody>
          ${dcma.map((c) => `<tr><td class="num">${c.id}</td><td>${esc(c.name)}</td><td>${statusPill(c.status)}</td></tr>`).join('')}
        </tbody></table></div>
        <p style="color:var(--dim);font-size:12.5px;margin-top:10px">Full detail on the Schedule Health view.</p>`),
    };
    el.querySelectorAll('[data-stat]').forEach((b) =>
      b.addEventListener('click', () => statModals[b.dataset.stat]?.()));

    el.querySelectorAll('[data-table]').forEach((tr) => {
      const open = () => {
        const name = tr.dataset.table;
        const rows = m.raw[name] || [];
        const fields = Object.keys(rows[0] || {});
        openModal(`%T ${name}`, `${rows.length} rows`, `
          <dl><dt>Fields</dt><dd class="num" style="font-size:12px">${esc(fields.join(', ') || '—')}</dd></dl>
          ${rows.length ? `<kbd class="formula">first row: ${esc(JSON.stringify(rows[0]).slice(0, 420))}${JSON.stringify(rows[0]).length > 420 ? '…' : ''}</kbd>` : ''}`);
      };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
  },
};

const ViewWBS = {
  id: 'wbs', title: 'WBS', group: 'Overview',
  chip(store) {
    if (!store.scope) return '';

      });
    }));
  },
};

}

// ---- src/views/timeline.js ----
// Timeline — the planner's controllable window over the whole schedule.
// Pick a reporting window (presets, custom dates, ◀ ▶ stepping); the lane
// chart zooms to it and paints, per activity: the planned bar, the actual
// bar (real act_start/act_end history), late edges, and the data-date rule.
// Filters: text, status, critical-only, late-only. Every bar is clickable.



function tlCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function tlIsLate(t, dd) {
  if (dd === undefined || t.status === 'TK_Complete') return false;
  return (t.targetEnd !== undefined && dayFloor(t.targetEnd) < dayFloor(dd))
    || (t.status === 'TK_NotStart' && t.targetStart !== undefined && dayFloor(t.targetStart) < dayFloor(dd));
}

function tlRows(store) {
  const m = store.model;
  const f = store.tlFilter;
  const { from, to } = store.win;
  const q = (f.q || '').toLowerCase();
  const rows = [];
  const walk = (node, depth) => {
    const kept = node.tasks.filter((t) => {
      if (t.targetStart === undefined || t.targetEnd === undefined) return false;
      const s = Math.min(t.targetStart, t.actStart ?? Infinity);
      // an in-progress activity is present through the data date, even when
      // its planned window is already behind us
      const e = Math.max(t.targetEnd, t.actEnd ?? 0,
        t.status === 'TK_Active' ? (m.dataDate ?? 0) : 0);
      if (dayFloor(e) < dayFloor(from) || dayFloor(s) > dayFloor(to)) return false;
      if (f.status !== 'all' && t.status !== f.status) return false;
      if (f.critical && !(t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete')) return false;
      if (f.late && !tlIsLate(t, m.dataDate)) return false;
      if (q && !(t.code.toLowerCase().includes(q) || t.name.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => a.targetStart - b.targetStart);
    if (kept.length) {
      rows.push({ header: node.name });
      for (const t of kept) rows.push({ t });
    }
    for (const c of node.children) walk(c, depth + 1);
  };
  walk(m.wbsRoot, 0);
  return rows;
}

function tlDraw(ctx, w, h, rows, store, hits) {
  hits.length = 0;
  const m = store.model;
  const { from, to } = store.win;
  const labelW = 132;
  const rowH = 20;
  const top = 22;
  const X = (ms) => labelW + ((ms - from) / Math.max(to - from, DAY_MS)) * (w - labelW - 10);
  const clampX = (x) => Math.min(Math.max(x, labelW), w - 10);

  // time grid: weekly if window <= ~10 weeks, else monthly
  ctx.font = '9px ' + tlCss('--mono');
  const weekly = (to - from) <= 76 * DAY_MS;
  let g = dayFloor(from);
  if (weekly) { while (new Date(g).getUTCDay() !== 0) g += DAY_MS; } // snap to Sunday
  else { const d = new Date(dayFloor(from)); g = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  while (g <= to) {
    const x = Math.round(X(g)) + 0.5;
    ctx.strokeStyle = 'rgba(34,48,73,.4)';
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, h - 4); ctx.stroke();
    const gd = new Date(g);
    ctx.fillStyle = tlCss('--dim-2');
    ctx.fillText(weekly
      ? `${String(gd.getUTCDate()).padStart(2, '0')}/${String(gd.getUTCMonth() + 1).padStart(2, '0')}`
      : `${String(gd.getUTCMonth() + 1).padStart(2, '0')}/${String(gd.getUTCFullYear()).slice(2)}`, x + 2, 12);
    if (weekly) g += 7 * DAY_MS;
    else { const d = new Date(g); g = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  }

  rows.forEach((row, i) => {
    const y = top + i * rowH;
    if (row.header) {
      ctx.fillStyle = tlCss('--dim-2');
      ctx.font = '600 9px ' + tlCss('--mono');
      ctx.fillText(('// ' + row.header).toUpperCase().slice(0, 60), 4, y + 13);
      ctx.strokeStyle = 'rgba(34,48,73,.5)';
      ctx.beginPath(); ctx.moveTo(0, y + rowH - 2.5); ctx.lineTo(w, y + rowH - 2.5); ctx.stroke();
      return;
    }
    const t = row.t;
    const late = tlIsLate(t, m.dataDate);
    const crit = t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete';
    ctx.font = '10px ' + tlCss('--mono');
    ctx.fillStyle = late ? tlCss('--bad') : crit ? tlCss('--warn') : tlCss('--dim');
    ctx.fillText(t.code.slice(0, 14), 4, y + 13);

    const by = y + 5, bh = 9;
    // planned bar: outline
    const px0 = clampX(X(t.targetStart)), px1 = clampX(X(t.targetEnd + DAY_MS));
    if (t.milestone) {
      const cx = px0, cy = by + bh / 2;
      ctx.fillStyle = crit || late ? tlCss('--bad') : tlCss('--text');
      ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy); ctx.closePath(); ctx.fill();
    } else if (px1 > px0) {
      ctx.strokeStyle = crit ? tlCss('--bad') : 'rgba(139,151,173,.55)';
      ctx.setLineDash(crit ? [3, 2] : []);
      ctx.strokeRect(px0 + 0.5, by + 0.5, px1 - px0 - 1, bh - 1);
      ctx.setLineDash([]);
    }
    // actual bar: solid history from real actual dates
    if (t.actStart !== undefined) {
      const aEnd = t.actEnd !== undefined ? t.actEnd : (m.dataDate ?? t.actStart);
      const ax0 = clampX(X(t.actStart)), ax1 = clampX(X(aEnd + DAY_MS));
      if (ax1 > ax0) {
        ctx.fillStyle = t.status === 'TK_Complete' ? 'rgba(38,165,161,.9)' : tlCss('--accent');
        ctx.fillRect(ax0, by + 2, ax1 - ax0, bh - 4);
      }
    }
    // late edge marker at the planned finish
    if (late && !t.milestone && px1 > labelW) {
      ctx.fillStyle = tlCss('--bad');
      ctx.fillRect(px1 - 1.5, by - 1, 3, bh + 2);
    }
    hits.push({ t, x0: labelW, x1: w, y0: y, y1: y + rowH, bx0: Math.min(px0, X(t.actStart ?? Infinity)), bx1: Math.max(px1, 0) });
  });

  // data date
  if (m.dataDate !== undefined && m.dataDate >= from && m.dataDate <= to) {
    const x = Math.round(X(m.dataDate)) + 0.5;
    ctx.strokeStyle = tlCss('--accent'); ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(x, top - 8); ctx.lineTo(x, h - 4); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = tlCss('--accent');
    ctx.fillText('DD', x + 3, top + 2);
  }
}

const ViewTimeline = {
  id: 'timeline', title: 'Timeline', group: 'Reporting',
  chip(store) {
    return `<span class="num">${isoDate(store.win.from)} → ${isoDate(store.win.to)}</span>`;
  },
  render(el, store) {
    const m = store.model;
    if (!store.tlFilter) store.tlFilter = { q: '', status: 'all', critical: false, late: false };
    const f = store.tlFilter;
    const rows = tlRows(store);
    const tasks = rows.filter((r) => r.t).map((r) => r.t);
    const lateCount = tasks.filter((t) => tlIsLate(t, m.dataDate)).length;

    el.innerHTML = `
      <div class="section">
        <h2>Timeline</h2>
        <p class="sub">Control the reporting window; the lanes zoom to it. Hollow bars are the plan, solid fills are recorded actuals, the red edge marks work past its planned date. Click any bar.</p>
        ${windowBarHTML(store)}
        <div class="filterrow">
          <input type="search" data-f-q placeholder="filter code / name…" value="${esc(f.q)}" aria-label="Filter activities">
          <select data-f-status aria-label="Status filter">
            <option value="all" ${f.status === 'all' ? 'selected' : ''}>All statuses</option>
            <option value="TK_Complete" ${f.status === 'TK_Complete' ? 'selected' : ''}>Complete</option>
            <option value="TK_Active" ${f.status === 'TK_Active' ? 'selected' : ''}>In progress</option>
            <option value="TK_NotStart" ${f.status === 'TK_NotStart' ? 'selected' : ''}>Not started</option>
          </select>
          <button class="winpreset ${f.critical ? 'active' : ''}" data-f-crit>Critical only</button>
          <button class="winpreset ${f.late ? 'active' : ''}" data-f-late>Late only</button>
          <span class="spacer"></span>
          <span class="chip"><span class="num">${tasks.length}</span> shown · <span class="num" style="color:${lateCount ? 'var(--bad)' : 'var(--good)'}">${lateCount}</span> late</span>
          <button class="btn small" data-csv>Export CSV</button>
        </div>
        <div class="chartbox"><canvas></canvas></div>
        <div class="legend">
          <span><i style="background:none;border:1px solid rgba(139,151,173,.55);height:8px"></i>planned</span>
          <span><i style="background:var(--accent);height:8px"></i>actual (in progress)</span>
          <span><i style="background:rgba(38,165,161,.9);height:8px"></i>actual (complete)</span>
          <span><i style="background:var(--bad);width:3px;height:10px"></i>late edge</span>
          <span><i style="background:none;border:1.5px dashed var(--bad);height:8px"></i>critical</span>
        </div>
        ${a11yTable('Timeline activities in window',
          ['Code', 'Activity', 'Planned start', 'Planned finish', 'Actual start', 'Actual finish', 'Status', 'Late'],
          tasks.map((t) => [t.code, t.name, fmtDate(t.targetStart), fmtDate(t.targetEnd),
            t.actStart !== undefined ? fmtDate(t.actStart) : 'n/a', t.actEnd !== undefined ? fmtDate(t.actEnd) : 'n/a',
            t.status, tlIsLate(t, m.dataDate) ? 'yes' : 'no']))}
      </div>`;

    wireWindowBar(el, store);
    const rerender = () => ViewTimeline.render(el, store);
    el.querySelector('[data-f-q]').addEventListener('input', (e) => { f.q = e.target.value; rerender(); });
    el.querySelector('[data-f-status]').addEventListener('change', (e) => { f.status = e.target.value; rerender(); });
    el.querySelector('[data-f-crit]').addEventListener('click', () => { f.critical = !f.critical; rerender(); });
    el.querySelector('[data-f-late]').addEventListener('click', () => { f.late = !f.late; rerender(); });
    el.querySelector('[data-csv]').addEventListener('click', () => downloadCSV(
      `timeline_${isoDate(store.win.from)}_${isoDate(store.win.to)}.csv`,
      ['code', 'name', 'wbs', 'planned_start', 'planned_finish', 'actual_start', 'actual_finish', 'status', 'float_wd', 'late'],
      tasks.map((t) => [t.code, t.name, m.wbsById.get(t.wbsId)?.name || '', isoDate(t.targetStart), isoDate(t.targetEnd),
        isoDate(t.actStart), isoDate(t.actEnd), t.status,
        t.floatDays !== undefined ? t.floatDays.toFixed(1) : '', tlIsLate(t, m.dataDate) ? 'yes' : 'no'])));

    const canvas = el.querySelector('canvas');
    const hits = [];
    const height = Math.min(Math.max(rows.length * 20 + 30, 120), 640);
    mountCanvas(canvas, height, (ctx, w, h) => tlDraw(ctx, w, h, rows, store, hits));
    const tip = chartTip(canvas.parentElement);
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const my = e.clientY - rect.top, mx = e.clientX - rect.left;
      const hit = hits.find((hh) => my >= hh.y0 && my < hh.y1 && mx >= hh.x0);
      canvas.style.cursor = hit ? 'pointer' : 'default';
      if (!hit) { tip.hide(); return; }
      const t = hit.t;
      tip.show(`<span class="num">${esc(t.code)}</span> ${esc(t.name.slice(0, 40))}<br>` +
        `plan <b>${fmtDate(t.targetStart)} → ${fmtDate(t.targetEnd)}</b>` +
        (t.actStart !== undefined ? `<br>actual <b>${fmtDate(t.actStart)} → ${t.actEnd !== undefined ? fmtDate(t.actEnd) : '…'}</b>` : ''), mx, my);
    });
    canvas.addEventListener('mouseleave', () => tip.hide());
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const my = e.clientY - rect.top, mx = e.clientX - rect.left;
      const hit = hits.find((hh) => my >= hh.y0 && my < hh.y1 && mx >= hh.x0);
      if (hit) openModal(`${hit.t.code} — ${hit.t.name}`, 'timeline detail', taskModalBody(hit.t, m));
    });
  },
};


// ---- src/views/report.js ----
// Period Report — the look-back: for the chosen window, what was done, what
// started, what was planned and missed, milestones hit and missed, and the
// value of work completed (real actual dates) against planned value. With a
// copy-ready plain-text report for the weekly email and CSV export.



function repTable(el, store, items, cols, mapRow, emptyText) {
  if (!items.length) return `<p class="sub" style="margin:4px 0 0">${esc(emptyText)}</p>`;
  return `<div class="tablewrap"><table class="ledger">
    <thead><tr>${cols.map((c) => `<th class="${c.num ? 'num' : ''}">${esc(c.h)}</th>`).join('')}</tr></thead>
    <tbody>${items.map((it, i) => `<tr class="rowlink" data-rep="${el}:${i}" tabindex="0">${mapRow(it)}</tr>`).join('')}</tbody>
  </table></div>`;
}

function slipCell(slipWd) {
  if (slipWd === undefined) return `<td class="num">${naTag('no data date')}</td>`;
  return `<td class="num" style="color:var(--bad)">+${slipWd} wd</td>`;
}

function buildReportText(store, rep) {
  const m = store.model;
  const L = [];
  const line = (s = '') => L.push(s);
  line(`PROGRESS REPORT — ${store.modelName}`);
  line(`Window: ${fmtDate(rep.from)} to ${fmtDate(rep.to)} · Data date: ${fmtDate(m.dataDate)}`);
  line('='.repeat(64));
  line();
  line(`COMPLETED IN WINDOW (${rep.completed.length}) — value ${fmtMoney(rep.valueDone)}`);
  for (const t of rep.completed) line(`  ${t.code.padEnd(10)} ${t.name}  [${fmtDate(t.actEnd)}]`);
  line();
  line(`STARTED IN WINDOW (${rep.started.length})`);
  for (const t of rep.started) line(`  ${t.code.padEnd(10)} ${t.name}  [${fmtDate(t.actStart)}]`);
  line();
  line(`MISSED FINISHES (${rep.missedFinish.length}) — planned to finish, not complete`);
  for (const { t, slipWd } of rep.missedFinish) line(`  ${t.code.padEnd(10)} ${t.name}  planned ${fmtDate(t.targetEnd)}${slipWd !== undefined ? ` · ${slipWd} wd behind` : ''}`);
  line();
  line(`MISSED STARTS (${rep.missedStart.length}) — planned to start, not started`);
  for (const { t, slipWd } of rep.missedStart) line(`  ${t.code.padEnd(10)} ${t.name}  planned ${fmtDate(t.targetStart)}${slipWd !== undefined ? ` · ${slipWd} wd behind` : ''}`);
  line();
  line(`MILESTONES — hit ${rep.milestonesHit.length}, missed ${rep.milestonesMissed.length}`);
  for (const t of rep.milestonesHit) line(`  ✓ ${t.code.padEnd(10)} ${t.name}  [${fmtDate(t.actEnd ?? t.actStart)}]`);
  for (const t of rep.milestonesMissed) line(`  ✗ ${t.code.padEnd(10)} ${t.name}  planned ${fmtDate(t.targetEnd)}`);
  line();
  line(`Planned value in window: ${fmtMoney(rep.valuePlanned)} · Completed value: ${fmtMoney(rep.valueDone)}`);
  line(`Generated by PRISM Deep Field — values derived only from the XER's own fields.`);
  return L.join('\n');
}

// Lookahead — the 2/4/6-week forward brief: what starts, what finishes,
// which constraints fall due, and which planned starts are NOT actually
// released because predecessors are incomplete (the readiness check that
// separates a lookahead from a wish list).



const LA_HORIZONS = [[14, '2 weeks'], [28, '4 weeks'], [42, '6 weeks']];

const ViewLookahead = {
  id: 'lookahead', title: 'Lookahead', group: 'Reporting',
  horizon: 28,
  chip(store) {
    return `next <span class="num">${ViewLookahead.horizon / 7}</span> wk`;
  },
  render(el, store) {
    const m = store.model;
    if (m.dataDate === undefined) {
      el.innerHTML = `<div class="empty"><h3>No data date</h3><p>${naTag('file has neither last_schedule_date nor last_recalc_date — a lookahead needs a "now"')}</p></div>`;
      return;
    }
    const from = dayFloor(m.dataDate) + DAY_MS;
    const to = dayFloor(m.dataDate) + ViewLookahead.horizon * DAY_MS;
    const la = store.getLookahead(from, to);

        </div>

          ${statTile({ id: 'fi', label: 'Finishing', value: `<span class="num">${la.finishing.length}</span>`, note: 'planned finishes in horizon' })}
          ${statTile({ id: 'bl', label: 'Blocked starts', value: `<span class="num">${la.blockedStarts.length}</span>`, tone: la.blockedStarts.length ? 'warn' : 'good', note: 'predecessors incomplete' })}
          ${statTile({ id: 'cn', label: 'Constraints due', value: `<span class="num">${la.constraintsDue.length}</span>`, tone: la.constraintsDue.length ? 'warn' : 'good', note: 'cstr_date in horizon' })}
        </div>
      </div>

      <div class="section">
        <h2>Blocked starts <span class="num" style="color:${la.blockedStarts.length ? 'var(--warn)' : 'var(--good)'}">${la.blockedStarts.length}</span></h2>
        <p class="sub">Planned to start in the horizon while a Finish-to-Start predecessor is unfinished (or a Start-to-Start predecessor unstarted). Chase these first.</p>
        ${la.blockedStarts.length ? `<div class="tablewrap"><table class="ledger">
          <thead><tr><th>Activity</th><th class="num">Planned start</th><th>Waiting on</th></tr></thead>
          <tbody>${la.blockedStarts.map((b, i) => `<tr class="rowlink" data-la="blocked:${i}" tabindex="0">
            <td><span class="num">${esc(b.t.code)}</span> ${esc(b.t.name)}</td>
            <td class="num">${fmtDate(b.t.targetStart)}</td>
            <td class="num">${b.blockers.map((x) => esc(x.pred.code) + (x.pred.status === 'TK_Active' ? ' (in progress)' : ' (not started)')).join(', ')}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<p class="sub">Every planned start in the horizon is logically released.</p>'}
      </div>

      <div class="section">
        <h2>Starting <span class="num">${la.starting.length}</span></h2>
        ${la.starting.length ? `<div class="tablewrap"><table class="ledger">
          <thead><tr><th>Code</th><th>Activity</th><th class="num">Planned start</th><th>Flags</th></tr></thead>
          <tbody>${taskRows(la.starting, (t) => t.targetStart, 'start')}</tbody></table></div>`
        : '<p class="sub">No planned starts in this horizon.</p>'}
      </div>

      <div class="section">
        <h2>Finishing <span class="num">${la.finishing.length}</span></h2>
        ${la.finishing.length ? `<div class="tablewrap"><table class="ledger">
          <thead><tr><th>Code</th><th>Activity</th><th class="num">Planned finish</th><th>Flags</th></tr></thead>
          <tbody>${taskRows(la.finishing, (t) => t.targetEnd, 'finish')}</tbody></table></div>`
        : '<p class="sub">No planned finishes in this horizon.</p>'}

      <div class="section">
        <h2>Constraints due <span class="num">${la.constraintsDue.length}</span></h2>
        ${la.constraintsDue.length ? `<div class="tablewrap"><table class="ledger">
          <thead><tr><th>Code</th><th>Activity</th><th class="num">Constraint</th><th class="num">Date</th></tr></thead>
          <tbody>${la.constraintsDue.map((t, i) => `<tr class="rowlink" data-la="cstr:${i}" tabindex="0">
            <td class="num">${esc(t.code)}</td><td>${esc(t.name)}</td>
            <td class="num">${esc(t.cstrType)}</td><td class="num">${fmtDate(t.cstrDate)}</td></tr>`).join('')}</tbody>
        </table></div>` : '<p class="sub">No constraint dates fall in this horizon.</p>'}
      </div>`;

    el.querySelectorAll('[data-hz]').forEach((b) => b.addEventListener('click', () => {
      ViewLookahead.horizon = +b.dataset.hz;
      ViewLookahead.render(el, store);
    }));

    const lists = { start: la.starting, finish: la.finishing, cstr: la.constraintsDue, blocked: la.blockedStarts.map((b) => b.t) };
    el.querySelectorAll('[data-la]').forEach((tr) => {
      const open = () => {
        const [k, i] = tr.dataset.la.split(':');
        const t = lists[k][+i];
        if (t) openModal(`${t.code} — ${t.name}`, 'lookahead detail', taskModalBody(t, m));
      };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });

    el.querySelector('[data-csv]').addEventListener('click', () => {
      const rows = [];
      for (const t of la.starting) rows.push(['starting', t.code, t.name, isoDate(t.targetStart), blockedIds.has(t.id) ? 'blocked' : '']);
      for (const t of la.finishing) rows.push(['finishing', t.code, t.name, isoDate(t.targetEnd), '']);
      for (const t of la.constraintsDue) rows.push(['constraint_due', t.code, t.name, isoDate(t.cstrDate), t.cstrType]);
      downloadCSV(`lookahead_${ViewLookahead.horizon}d_${isoDate(from)}.csv`,
        ['category', 'code', 'name', 'date', 'flag'], rows);
    });
  },
};


// ---- src/views/gantt.js ----
// Gantt — WBS-reach task cards; expanding a card opens the detail modal with
// a canvas mini-Gantt. Critical work is drawn as a dashed outline (same hue,
// not a new color). Every canvas ships a hidden table for screen readers.




function subtreeTasks(node) {
  const out = [...node.tasks];
  for (const c of node.children) out.push(...subtreeTasks(c));
  return out;
}

function drawMiniGantt(ctx, w, h, tasks, model) {
  const pad = { l: 74, r: 12, t: 8, b: 22 };
  const t0 = Math.min(...tasks.map((t) => t.targetStart ?? Infinity));
  const t1 = Math.max(...tasks.map((t) => t.targetEnd ?? 0));
  if (!Number.isFinite(t0) || t1 <= t0) return;
  const x = (ms) => pad.l + ((ms - t0) / (t1 - t0)) * (w - pad.l - pad.r);
  const rowH = (h - pad.t - pad.b) / tasks.length;
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  // month grid
  ctx.strokeStyle = css('--border-soft'); ctx.fillStyle = css('--dim-2');
  ctx.font = '10px ' + css('--mono'); ctx.lineWidth = 1;
  const d0 = new Date(dayFloor(t0));
  let g = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1);
  while (g < t1) {
    const gx = Math.round(x(g)) + 0.5;
    ctx.beginPath(); ctx.moveTo(gx, pad.t); ctx.lineTo(gx, h - pad.b); ctx.stroke();
    const gd = new Date(g);
    ctx.fillText(`${String(gd.getUTCMonth() + 1).padStart(2, '0')}/${String(gd.getUTCFullYear()).slice(2)}`, gx + 3, h - 8);
    g = Date.UTC(gd.getUTCFullYear(), gd.getUTCMonth() + 3, 1);
  }

  tasks.forEach((t, i) => {
    const y = pad.t + i * rowH;
    const bh = Math.max(Math.min(rowH - 6, 12), 4);
    const by = y + (rowH - bh) / 2;
    ctx.fillStyle = css('--dim-2');
    ctx.font = '10px ' + css('--mono');
    ctx.fillText(t.code.slice(0, 9), 2, by + bh - 1);
    if (t.targetStart === undefined || t.targetEnd === undefined) return;
    const bx = x(t.targetStart);
    const bw = Math.max(x(t.targetEnd) - bx, 2);
    const crit = t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete';
    if (t.milestone) {
      ctx.fillStyle = crit ? css('--bad') : css('--trace');
      const cx = bx, cy = by + bh / 2, s2 = bh / 2 + 1;
      ctx.beginPath(); ctx.moveTo(cx, cy - s2); ctx.lineTo(cx + s2, cy); ctx.lineTo(cx, cy + s2); ctx.lineTo(cx - s2, cy); ctx.closePath(); ctx.fill();
      return;
    }
    ctx.fillStyle = css('--raised-2');
    ctx.fillRect(bx, by, bw, bh);
    const earned = computeEarnedPct(t, model.dataDate);
    if (earned > 0) { ctx.fillStyle = css('--trace'); ctx.fillRect(bx, by, bw * earned, bh); }
    ctx.strokeStyle = crit ? css('--bad') : css('--border');
    ctx.setLineDash(crit ? [4, 3] : []);
    ctx.lineWidth = crit ? 1.5 : 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    ctx.setLineDash([]);
  });

  // data date line
  if (model.dataDate !== undefined && model.dataDate > t0 && model.dataDate < t1) {
    const dx = Math.round(x(model.dataDate)) + 0.5;
    ctx.strokeStyle = css('--dim'); ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(dx, pad.t); ctx.lineTo(dx, h - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = css('--dim');
    ctx.fillText('DD', dx - 7, pad.t + 8);
  }
}

const ViewGantt = {
  id: 'gantt', title: 'Gantt', group: 'Schedule',
  chip(store) {
    if (!store.scope) return '';
    const n = store.model.wbsById.get(store.scope);
    return n ? `scope: ${esc(n.shortName || n.name)}` : '';
  },
  render(el, store) {
    const m = store.model;
    const scopeNode = (store.scope && m.wbsById.get(store.scope)) || m.wbsRoot;
    let nodes = scopeNode.children.length ? scopeNode.children : [scopeNode];
    // flatten one more level where a child is only a container
    nodes = nodes.flatMap((n) => (n.tasks.length === 0 && n.children.length ? n.children : [n]));

    const { stats } = store.d.rollup;
    el.innerHTML = `
      <div class="section">
        <h2>Gantt — ${esc(scopeNode.name)}</h2>
        <p class="sub">One card per WBS reach. Open a card for its mini-Gantt; dashed outline marks critical work. Set scope from the WBS view.</p>
        <div class="cardgrid">
          ${nodes.map((n) => {
            const s = stats.get(n.id);
            if (!s || s.taskCount === 0) return '';
            return `<button class="card taskcard" data-node="${esc(n.id)}">
              <div style="display:flex;gap:12px;align-items:center">
                ${ringSVG(s.pct, 'var(--trace)')}
                <div style="min-width:0">
                  <h4>${esc(n.name)}</h4>
                  <div class="meta"><span class="num">${s.taskCount}</span> activities · <span class="num">${s.pct !== undefined ? fmtPct(s.pct) : '—'}</span> earned</div>
                  <div class="meta" style="margin-top:4px">${s.critical ? `<span class="badge-crit">${s.critical} critical</span>` : '<span style="color:var(--dim-2)">no critical work</span>'}</div>
                </div>
              </div>
            </button>`;
          }).join('')}
        </div>
      </div>`;

    el.querySelectorAll('[data-node]').forEach((btn) => btn.addEventListener('click', () => {
      const node = m.wbsById.get(btn.dataset.node);
      const tasks = subtreeTasks(node)
        .filter((t) => t.targetStart !== undefined)
        .sort((a, b) => a.targetStart - b.targetStart || a.targetEnd - b.targetEnd);
      const height = Math.min(Math.max(tasks.length * 20 + 34, 90), 460);
      const card = openModal(node.name, `${tasks.length} activities — planned bars, earned fill, dashed = critical`, `
        <div class="chartbox"><canvas></canvas></div>
        <div class="legend">
          <span><i style="background:var(--raised-2);border:1px solid var(--border);height:8px"></i>planned</span>
          <span><i style="background:var(--trace);height:8px"></i>earned</span>
          <span><i style="background:none;border:1.5px dashed var(--bad);height:8px"></i>critical</span>
        </div>
        ${a11yTable(`Schedule bars for ${node.name}`,
          ['Code', 'Activity', 'Planned start', 'Planned finish', 'Status', 'Critical'],
          tasks.map((t) => [t.code, t.name, fmtDate(t.targetStart), fmtDate(t.targetEnd), t.status,
            t.totalFloatHrs !== undefined && t.totalFloatHrs <= 0 && t.status !== 'TK_Complete' ? 'yes' : 'no']))}
        <div class="tablewrap" style="margin-top:10px"><table class="ledger"><tbody>
          ${tasks.map((t) => `<tr class="rowlink" data-task="${esc(t.id)}" tabindex="0"><td class="num">${esc(t.code)}</td><td>${esc(t.name)}</td><td class="num">${fmtDate(t.targetEnd)}</td></tr>`).join('')}
        </tbody></table></div>`);
      mountCanvas(card.querySelector('canvas'), height, (ctx, w, h) => drawMiniGantt(ctx, w, h, tasks, m));
      card.querySelectorAll('[data-task]').forEach((tr) => tr.addEventListener('click', () => {
        const t = m.taskById.get(tr.dataset.task);
        openModal(`${t.code} — ${t.name}`, esc(node.name), taskModalBody(t, m));
      }));
    }));
  },
};

            <dt>Successor</dt><dd><span class="num">${esc(o.succ.code)}</span> ${esc(o.succ.name)} — KP <span class="num">${o.succKp.toFixed(3)}</span></dd>

          <p><b>Suggested review:</b> confirm whether this tie is a genuine constraint (e.g. a tie-in or shared crew returning up-station) or a modelling slip. If it is a slip, re-point the relationship at the activity covering the correct reach. This tool flags; the planner decides.</p>`);

// ---- src/views/scurve.js ----
// S-Curve — period PV bars + cumulative PV line (the one brass line), with
// EV and AC as exactly one point each at the data date. A single XER file has
// no history of actuals; drawing one would be fabrication, so this view never
// does. Baseline cumulative (when loaded) renders in the slate trace color.




const ViewSCurve = {
  id: 'scurve', title: 'S-Curve', group: 'Cost & Resources',
  chip(store) {
    const e = store.d.evm;
    return `BAC <span class="num">${esc(fmtMoney(e.bac))}</span>`;
  },
  render(el, store) {
    const m = store.model;
    const evm = store.d.evm;
    const baseEvm = store.baseline ? computeEVM(store.baseline) : null;

    const ring = (label, v, fmt, color, note) => `
      <div class="ring">${ringSVG(v === null || v === undefined ? 0 : Math.min(v, 1), color)}
        <div><div class="rv">${v === null || v === undefined ? '—' : fmt(v)}</div><div class="rl">${label}</div>
        ${note ? `<div style="font-size:11px;color:var(--dim-2)">${note}</div>` : ''}</div>
      </div>`;

    el.innerHTML = `
      <div class="section">
        <h2>Cost curve</h2>
        <p class="sub">Monthly planned value with the cumulative plan line. EV and AC are single marks at the data date — the file carries one snapshot of actuals, not a history, so no actual curve is drawn.</p>
        <div class="ringrow">
          ${ring('SPI', evm.spi.value, (v) => v.toFixed(2), evm.spi.value >= 0.95 ? 'var(--good)' : evm.spi.value >= 0.85 ? 'var(--warn)' : 'var(--bad)', evm.spi.value === null ? esc(evm.spi.reason) : '')}
          ${ring('CPI', evm.cpi.value, (v) => v.toFixed(2), evm.cpi.value >= 0.95 ? 'var(--good)' : evm.cpi.value >= 0.85 ? 'var(--warn)' : 'var(--bad)', evm.cpi.value === null ? esc(evm.cpi.reason) : '')}
          ${ring('% earned', evm.earnedPct, (v) => fmtPct(v), 'var(--trace)')}
        </div>
        <div class="chartbox"><canvas></canvas></div>
        <div class="legend">
          <span><i style="background:var(--raised-2);border:1px solid var(--border);height:8px"></i>PV per month</span>
          <span><i style="background:var(--chart-line)"></i>cumulative PV</span>
          ${baseEvm ? '<span><i style="background:var(--trace)"></i>baseline cumulative PV</span>' : ''}
          <span><i class="dot" style="background:var(--good)"></i>EV at data date</span>
          <span><i class="dot" style="background:var(--bad)"></i>AC at data date</span>
        </div>
        ${a11yTable('Planned value by month', ['Month', 'PV', 'Cumulative PV'],
          evm.pv.map((p) => [p.key, Math.round(p.planned), Math.round(p.cum)]))}
        <p class="visually-hidden">EV at data date: ${Math.round(evm.ev)}. AC at data date: ${Math.round(evm.ac)}.</p>
      </div>

      <div class="section">
        <h2>Forecast</h2>
        <div class="statrow">
          <button class="stat" data-kpi="bac"><div class="label">BAC</div><div class="value">${esc(fmtMoney(evm.bac))}</div></button>
          <button class="stat" data-kpi="eac"><div class="label">EAC</div><div class="value ${evm.eac > evm.bac ? 'bad' : ''}">${evm.eac !== undefined ? esc(fmtMoney(evm.eac)) : ''}${evm.eac === undefined ? naTag('CPI not computable') : ''}</div></button>
          <button class="stat" data-kpi="etc"><div class="label">ETC</div><div class="value">${evm.etc !== undefined ? esc(fmtMoney(evm.etc)) : ''}${evm.etc === undefined ? naTag('CPI not computable') : ''}</div></button>
          <button class="stat" data-kpi="vac"><div class="label">VAC</div><div class="value ${evm.vac < 0 ? 'bad' : 'good'}">${evm.vac !== undefined ? esc(fmtMoney(evm.vac)) : ''}${evm.vac === undefined ? naTag('CPI not computable') : ''}</div></button>
          <button class="stat" data-kpi="tcpi"><div class="label">TCPI</div><div class="value">${evm.tcpi !== undefined ? `<span class="num">${evm.tcpi.toFixed(2)}</span>` : naTag('BAC = AC')}</div></button>
        </div>
      </div>`;

    const canvas = el.querySelector('canvas');
    const box = canvas.parentElement;
    const tip = chartTip(box);
    let geom = null;

    mountCanvas(canvas, 300, (ctx, w, h) => {
      const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      const pad = { l: 58, r: 16, t: 12, b: 26 };
      const pv = evm.pv;
      if (!pv.length) return;
      const maxCum = Math.max(evm.bac, baseEvm ? baseEvm.bac : 0) * 1.04;
      const maxBar = Math.max(...pv.map((p) => p.planned)) * 1.15;
      const X = (i) => pad.l + (i + 0.5) * ((w - pad.l - pad.r) / pv.length);
      const bw = Math.max(((w - pad.l - pad.r) / pv.length) * 0.62, 2);
      const Y = (v) => h - pad.b - (v / maxCum) * (h - pad.t - pad.b);
      const Yb = (v) => h - pad.b - (v / maxBar) * (h - pad.t - pad.b) * 0.45;

      // grid + axis labels (money on cumulative scale)
      ctx.font = '10px ' + css('--mono');
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const v = (maxCum / 4) * i;
        const y = Math.round(Y(v)) + 0.5;
        ctx.strokeStyle = css('--border-soft');
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
        ctx.fillStyle = css('--dim-2');
        ctx.fillText(fmtMoney(v, ''), 6, y - 3);
      }
      // month labels: every ~3rd
      pv.forEach((p, i) => {
        if (i % Math.ceil(pv.length / 8) !== 0) return;
        ctx.fillStyle = css('--dim-2');
        ctx.fillText(p.key, X(i) - 18, h - 8);
      });
      // bars (period PV) — thin marks, 2px gap comes from bar width factor
      pv.forEach((p, i) => {
        ctx.fillStyle = css('--raised-2');
        ctx.strokeStyle = css('--border');
        const x0 = X(i) - bw / 2, y0 = Yb(p.planned);
        ctx.fillRect(x0, y0, bw, h - pad.b - y0);
        ctx.strokeRect(x0 + 0.5, y0 + 0.5, bw - 1, h - pad.b - y0 - 1);
      });
      // baseline cumulative (trace)
      if (baseEvm && baseEvm.pv.length) {
        ctx.strokeStyle = css('--trace'); ctx.lineWidth = 2; ctx.beginPath();
        baseEvm.pv.forEach((p, i) => {
          const px = pad.l + ((p.start - pv[0].start) / (periodStart(pv[pv.length - 1].key, 'month') - pv[0].start)) * (w - pad.l - pad.r - X(0) + pad.l);
          const cx = Math.min(Math.max(px, pad.l), w - pad.r);
          i === 0 ? ctx.moveTo(cx, Y(p.cum)) : ctx.lineTo(cx, Y(p.cum));
        });
        ctx.stroke();
      }
      // cumulative PV — the one signal line
      ctx.strokeStyle = css('--chart-line'); ctx.lineWidth = 2; ctx.beginPath();
      pv.forEach((p, i) => (i === 0 ? ctx.moveTo(X(i), Y(p.cum)) : ctx.lineTo(X(i), Y(p.cum))));
      ctx.stroke();

      // data-date rule + EV/AC single points (with 2px surface ring)
      if (evm.evPoint) {
        const ddX = (() => {
          const first = pv[0].start, last = periodStart(pv[pv.length - 1].key, 'month');
          const f = (evm.evPoint.date - first) / (last - first);
          return pad.l + Math.min(Math.max(f, 0), 1) * (w - pad.l - pad.r);
        })();
        ctx.strokeStyle = css('--dim'); ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(ddX, pad.t); ctx.lineTo(ddX, h - pad.b); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = css('--dim');
        ctx.fillText('data date', ddX + 4, pad.t + 9);
        const pt = (v, color, label, dy) => {
          ctx.beginPath(); ctx.arc(ddX, Y(v), 6, 0, Math.PI * 2);
          ctx.fillStyle = css('--bg'); ctx.fill();
          ctx.beginPath(); ctx.arc(ddX, Y(v), 4.5, 0, Math.PI * 2);
          ctx.fillStyle = color; ctx.fill();
          ctx.fillStyle = css('--text');
          ctx.fillText(`${label} ${fmtMoney(v, '')}`, ddX + 9, Y(v) + dy);
        };
        pt(evm.ev, css('--good'), 'EV', 3);
        pt(evm.ac, css('--bad'), 'AC', evm.ac > evm.ev - maxCum * 0.05 && evm.ac < evm.ev + maxCum * 0.05 ? 14 : 3);
      }
      geom = { pad, w, h, X, count: pv.length };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!geom) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const i = Math.min(Math.max(Math.round((mx - geom.pad.l) / ((geom.w - geom.pad.l - geom.pad.r) / geom.count) - 0.5), 0), geom.count - 1);
      const p = evm.pv[i];
      if (!p) { tip.hide(); return; }
      tip.show(`${esc(p.key)}<br>PV <b>${esc(fmtMoney(p.planned))}</b><br>cum <b>${esc(fmtMoney(p.cum))}</b>`, mx, e.clientY - rect.top);
    });
    canvas.addEventListener('mouseleave', () => tip.hide());

    const kpiModals = {
      bac: ['Budget at Completion', 'Σ assigned cost across all activities', `<kbd class="formula">BAC = Σ TASKRSRC.target_cost = ${fmtMoney(evm.bac)}</kbd>`],
      eac: ['Estimate at Completion', 'AC + (BAC − EV) ÷ CPI', `<kbd class="formula">EAC = ${fmtMoney(evm.ac)} + (${fmtMoney(evm.bac)} − ${fmtMoney(evm.ev)}) ÷ ${fmtRatio(evm.cpi.value) ?? 'N/A'} = ${evm.eac !== undefined ? fmtMoney(evm.eac) : 'N/A'}</kbd>`],
      etc: ['Estimate to Complete', 'EAC − AC', `<kbd class="formula">ETC = ${evm.eac !== undefined ? `${fmtMoney(evm.eac)} − ${fmtMoney(evm.ac)} = ${fmtMoney(evm.etc)}` : 'N/A — CPI not computable'}</kbd>`],
      vac: ['Variance at Completion', 'BAC − EAC', `<kbd class="formula">VAC = ${evm.vac !== undefined ? `${fmtMoney(evm.bac)} − ${fmtMoney(evm.eac)} = ${fmtMoney(evm.vac)}` : 'N/A — CPI not computable'}</kbd>`],
      tcpi: ['To-Complete Performance Index', '(BAC − EV) ÷ (BAC − AC)', `<kbd class="formula">TCPI = (${fmtMoney(evm.bac)} − ${fmtMoney(evm.ev)}) ÷ (${fmtMoney(evm.bac)} − ${fmtMoney(evm.ac)}) = ${evm.tcpi !== undefined ? evm.tcpi.toFixed(2) : 'N/A'}</kbd><p>Efficiency required on all remaining work to land on BAC.</p>`],
    };
    el.querySelectorAll('[data-kpi]').forEach((b) => b.addEventListener('click', () => {
      const [t, s, body] = kpiModals[b.dataset.kpi];
      openModal(t, s, body);
    }));
  },
};


// ---- src/views/resource.js ----
// Resource Histogram — weekly stacked bars by resource type; over-allocation
// only where a RSRCRATE ceiling exists, with the honest "ceiling unavailable"
// list for everything else.



const RTYPE = [
  ['RT_Labor', 'Labour', '--cat-labor'],
  ['RT_Equip', 'Equipment', '--cat-equip'],
  ['RT_Mat', 'Material', '--cat-mat'],
];

const ViewResource = {
  id: 'resource', title: 'Resource Histogram', group: 'Cost & Resources',
  chip(store) {
    return `<span class="num">${store.model.rsrcById.size}</span> resources`;
  },
  render(el, store) {
    const m = store.model;
    const d = store.d.demand;
    const keys = d.keys;
    const series = RTYPE.filter(([type]) => d.byType.has(type));

    el.innerHTML = `
      <div class="section">
        <h2>Weekly demand by resource type</h2>
        <p class="sub">Assigned quantities spread across each activity's working-day span (via its calendar), bucketed by week.</p>
        <div class="chartbox"><canvas></canvas></div>
        <div class="legend">
          ${series.map(([, label, cvar]) => `<span><i style="background:var(${cvar});height:8px"></i>${label}</span>`).join('')}
        </div>
        ${a11yTable('Weekly resource demand (quantity hours)', ['Week', ...series.map(([, l]) => l)],
          keys.map((k) => [k, ...series.map(([type]) => Math.round(d.byType.get(type).get(k) || 0))]))}
      </div>

      <div class="section">
        <h2>Over-allocation</h2>
        <p class="sub">Computable only for resources with a <span class="num">RSRCRATE.max_qty_per_hr</span> ceiling. Flagged where a week's average demand clearly exceeds it (&gt;5% over).</p>
        ${d.overalloc.length === 0 ? '<div class="empty"><h3>No breaches</h3><p>No ceilinged resource exceeds its limit in any week.</p></div>'
        : `<div class="tablewrap"><table class="ledger">
            <thead><tr><th>Resource</th><th class="num">Week of</th><th class="num">Avg demand /hr</th><th class="num">Ceiling /hr</th><th class="num">Load</th></tr></thead>
            <tbody>${d.overalloc.map((o, i) => `<tr class="rowlink" data-oa="${i}" tabindex="0">
              <td>${esc(o.rsrc.name)}</td>
              <td class="num">${fmtDate(o.start)}</td>
              <td class="num">${o.avgPerHr.toFixed(2)}</td>
              <td class="num">${o.maxPerHr}</td>
              <td class="num" style="color:${o.ratio > 1.5 ? 'var(--bad)' : 'var(--warn)'}">${Math.round(o.ratio * 100)}%</td>
            </tr>`).join('')}</tbody>
          </table></div>`}
        ${d.noCeiling.length ? `<p class="sub" style="margin-top:12px">Ceiling unavailable (no RSRCRATE row) — over-allocation <b>not computable</b>, not assumed fine: ${d.noCeiling.map((r) => `<span class="num">${esc(r.name)}</span>`).join(', ')}.</p>` : ''}
      </div>`;

    const canvas = el.querySelector('canvas');
    const tip = chartTip(canvas.parentElement);
    let geom = null;

    mountCanvas(canvas, 280, (ctx, w, h) => {
      const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      const pad = { l: 46, r: 10, t: 12, b: 26 };
      if (!keys.length) return;
      const totals = keys.map((k) => series.reduce((a, [type]) => a + (d.byType.get(type).get(k) || 0), 0));
      const maxV = Math.max(...totals) * 1.1 || 1;
      const step = (w - pad.l - pad.r) / keys.length;
      const bw = Math.max(step - 2, 1); // 2px surface gap between adjacent bars
      const Y = (v) => h - pad.b - (v / maxV) * (h - pad.t - pad.b);

      ctx.font = '10px ' + css('--mono');
      for (let i = 0; i <= 4; i++) {
        const v = (maxV / 4) * i;
        const y = Math.round(Y(v)) + 0.5;
        ctx.strokeStyle = css('--border-soft');
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
        ctx.fillStyle = css('--dim-2');
        ctx.fillText(String(Math.round(v)), 6, y - 3);
      }
      keys.forEach((k, i) => {
        let y0 = h - pad.b;
        for (const [type, , cvar] of series) {
          const v = d.byType.get(type).get(k) || 0;
          if (v <= 0) continue;
          const hh = (v / maxV) * (h - pad.t - pad.b);
          ctx.fillStyle = css(cvar);
          ctx.fillRect(pad.l + i * step + 1, y0 - hh, bw, Math.max(hh - 2, 1)); // 2px gap between stack segments
          y0 -= hh;
        }
        if (i % Math.ceil(keys.length / 9) === 0) {
          ctx.fillStyle = css('--dim-2');
          ctx.fillText(k.slice(2), pad.l + i * step, h - 8);
        }
      });
      geom = { pad, step };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!geom) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const i = Math.floor((mx - geom.pad.l) / geom.step);
      const k = keys[i];
      if (!k) { tip.hide(); return; }
      tip.show(`week of ${esc(fmtDate(periodStart(k, 'week')))}<br>${series.map(([type, label]) =>
        `${label} <b>${Math.round(d.byType.get(type).get(k) || 0)}</b>`).join('<br>')}`, mx, e.clientY - rect.top);
    });
    canvas.addEventListener('mouseleave', () => tip.hide());

    el.querySelectorAll('[data-oa]').forEach((tr) => {
      const open = () => {
        const o = d.overalloc[+tr.dataset.oa];
        const users = m.assignments
          .filter((a) => a.rsrcId === o.rsrc.id)
          .map((a) => m.taskById.get(a.taskId))
          .filter((t) => t && t.targetStart !== undefined && t.targetEnd !== undefined
            && t.targetStart <= o.start + 7 * 86400000 && t.targetEnd >= o.start);
        openModal(`${o.rsrc.name} — week of ${fmtDate(o.start)}`, 'over-allocation detail', `
          <dl>
            <dt>Avg demand</dt><dd class="num">${o.avgPerHr.toFixed(2)} /hr</dd>
            <dt>Ceiling</dt><dd class="num">${o.maxPerHr} /hr (RSRCRATE.max_qty_per_hr)</dd>
            <dt>Load</dt><dd class="num">${Math.round(o.ratio * 100)}%</dd>
          </dl>
          <h4 style="margin:10px 0 4px;font-size:12px;color:var(--dim-2);text-transform:uppercase;letter-spacing:.08em">Activities drawing on it that week</h4>
          <ul class="offender-list">${users.map((t) => `<li>${esc(t.code)} ${esc(t.name.slice(0, 40))}</li>`).join('') || '<li>—</li>'}</ul>
          <p style="margin-top:10px"><b>Suggested review:</b> stagger the overlapping activities or add a second ${esc(o.rsrc.name)} spread — the schedule logic currently books both at once.</p>`);
      };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
  },
};


// ---- src/views/compare.js ----
// Compare — three tabs over ONE shared compare.js output. Requires a second
// file; without one the view says so honestly and offers to load it.



const cmpSlip = (v) => v === undefined ? '—'
  : v > 0 ? `<span style="color:var(--bad)">+${v} wd</span>`
  : v < 0 ? `<span style="color:var(--good)">${v} wd</span>`
  : '<span style="color:var(--dim-2)">0</span>';

const ViewCompare = {
  id: 'compare', title: 'Baseline Compare', group: 'Compare',
  tab: 'activity',
  chip(store) {
    return store.baseline ? `vs <span class="num">${esc(store.baselineName)}</span>` : '';
  },
  render(el, store) {
    if (!store.baseline) {
      el.innerHTML = `
        <div class="empty">
          <h3>No baseline loaded</h3>
          <p>Comparison needs a second .xer export. Activities are matched by <span class="num">task_code</span> — the stable key across P6 re-imports.</p>
          <p style="margin-top:14px">
            <button class="btn" data-load-baseline-file>Load baseline .xer…</button>
            <button class="btn primary" data-load-demo-baseline>Use demo baseline</button>
          </p>
        </div>`;
      el.querySelector('[data-load-demo-baseline]').addEventListener('click', () => store.useDemoBaseline());
      el.querySelector('[data-load-baseline-file]').addEventListener('click', () => store.pickFile('baseline'));
      return;
    }

    const m = store.model;
    const cmp = store.d.cmp;
    const tab = ViewCompare.tab;

    const tabs = [['activity', 'Activity Variance'], ['wbs', 'WBS Variance'], ['crit', 'Critical Path Shift']];
    let body = '';

    if (tab === 'activity') {
      const slipped = cmp.matched.filter((x) => x.slipDays !== undefined && x.slipDays !== 0);
      body = `
        <div class="statrow" style="margin-bottom:16px">
          ${statTile({ id: 'matched', label: 'Matched', value: `<span class="num">${cmp.matched.length}</span>`, note: 'by task_code' })}
          ${statTile({ id: 'added', label: 'Added', value: `<span class="num">${cmp.added.length}</span>`, note: 'in current only' })}
          ${statTile({ id: 'removed', label: 'Removed', value: `<span class="num">${cmp.removed.length}</span>`, note: 'in baseline only' })}
          ${statTile({ id: 'slipped', label: 'Slipped', value: `<span class="num">${slipped.filter((x) => x.slipDays > 0).length}</span>`, tone: 'warn', note: 'later than baseline' })}
        </div>
        <div class="tablewrap"><table class="ledger">
          <thead><tr><th>Activity</th><th class="num">Baseline finish</th><th class="num">Current finish</th><th class="num">Slip</th></tr></thead>
          <tbody>${cmp.matched.slice(0, 60).map((x) => `<tr class="rowlink" data-code="${esc(x.code)}" tabindex="0">
            <td><span class="num">${esc(x.code)}</span> ${esc(x.cur.name.slice(0, 44))}</td>
            <td class="num">${fmtDate(x.baseFinish)}</td>
            <td class="num">${fmtDate(x.curFinish)}</td>
            <td class="num">${cmpSlip(x.slipDays)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
    } else if (tab === 'wbs') {
      body = `
        <div class="tablewrap"><table class="ledger">
          <thead><tr><th>WBS node</th><th class="num">Cost weight</th><th class="num">Cost-weighted slip</th><th>Worst activity</th></tr></thead>
          <tbody>${cmp.wbsVariance.map((v, i) => `<tr class="rowlink" data-wv="${i}" tabindex="0">
            <td>${esc(v.node ? v.node.name : '(unplaced)')}</td>
            <td class="num">${esc(fmtMoney(v.cost))}</td>
            <td class="num">${v.meanSlip !== undefined ? cmpSlip(+v.meanSlip.toFixed(1)) : naTag('no cost in subtree')}</td>
            <td class="num">${v.worst ? `${esc(v.worst.code)} (${v.worst.slipDays} wd)` : '—'}</td>
          </tr>`).join('')}</tbody>
        </table></div>
        <p class="sub" style="margin-top:10px">Same cost-weighting rule as the WBS rollup: Σ(cost × slip) ÷ Σ(cost) over matched activities in the node.</p>`;
    } else {
      const list = (title, tasks, tone) => `
        <div class="section">
          <h2>${title} <span class="num" style="color:${tone}">${tasks.length}</span></h2>
          ${tasks.length === 0 ? '<p class="sub">None.</p>' : `<div class="tablewrap"><table class="ledger"><tbody>
            ${tasks.map((t) => `<tr class="rowlink" data-code="${esc(t.code)}" tabindex="0">
              <td class="num">${esc(t.code)}</td><td>${esc(t.name)}</td>
              <td class="num">${t.floatDays !== undefined ? t.floatDays.toFixed(1) + ' wd float' : '—'}</td>
            </tr>`).join('')}</tbody></table></div>`}
        </div>`;
      body = `
        <p class="sub">Set difference of {total float ≤ 0, incomplete} between the two files (current ${cmp.curCritCount} vs baseline ${cmp.baseCritCount}) — deliberately not a re-derived CPM sequence diff.</p>
        ${list('Newly critical', cmp.nowCritical, 'var(--bad)')}
        ${list('No longer critical', cmp.leftCritical, 'var(--good)')}`;
    }

    el.innerHTML = `
      <div class="section">
        <h2>Baseline compare</h2>
        <p class="sub"><b>${esc(store.modelName)}</b> vs baseline <b>${esc(store.baselineName)}</b> — one diff, three lenses.</p>
        <div class="tabs">${tabs.map(([id, label]) => `<button class="tab ${tab === id ? 'active' : ''}" data-tab="${id}">${label}</button>`).join('')}</div>
        ${body}
      </div>`;

    el.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
      ViewCompare.tab = b.dataset.tab;
      ViewCompare.render(el, store);
    }));
    el.querySelectorAll('[data-code]').forEach((tr) => {
      const open = () => {
        const match = cmp.matched.find((x) => x.code === tr.dataset.code);
        const t = m.taskByCode.get(tr.dataset.code) || (match && match.cur);
        if (!t) return;
        const b = store.baseline.taskByCode.get(t.code);
        openModal(`${t.code} — ${t.name}`, 'current vs baseline', `
          ${taskModalBody(t, m)}
          <h4 style="margin:6px 0 4px;font-size:12px;color:var(--dim-2);text-transform:uppercase;letter-spacing:.08em">Baseline</h4>
          ${b ? `<dl><dt>Planned</dt><dd class="num">${fmtDate(b.targetStart)} → ${fmtDate(b.targetEnd)}</dd>
          <dt>Slip</dt><dd class="num">${match && match.slipDays !== undefined ? cmpSlip(match.slipDays) : '—'}</dd></dl>` : naTag('not in baseline (added activity)')}`);
      };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
    el.querySelectorAll('[data-wv]').forEach((tr) => {
      const open = () => {
        const v = cmp.wbsVariance[+tr.dataset.wv];
        openModal(v.node ? v.node.name : 'Unplaced activities', 'WBS variance detail', `
          <dl>
            <dt>Matched activities</dt><dd class="num">${v.count}</dd>
            <dt>Cost weight</dt><dd class="num">${esc(fmtMoney(v.cost))}</dd>
            <dt>Weighted slip</dt><dd>${v.meanSlip !== undefined ? cmpSlip(+v.meanSlip.toFixed(1)) : naTag('no cost in subtree — slip not weightable')}</dd>
            <dt>Worst</dt><dd>${v.worst ? `<span class="num">${esc(v.worst.code)}</span> at +${v.worst.slipDays} wd` : '—'}</dd>
          </dl>`);
      };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
  },
};


// ---- src/app.js ----
// app.js — the Store (the only thing that calls parseXER/buildModel), the
// shell (sidebar, header, drawer), and the hash router. Views subscribe to
// the store's change event; no view imports another view's state.
























const VIEWS = [ViewCommand, ViewWBS, ViewHealth,
  ViewTimeline, ViewReport, ViewLookahead,
  ViewGantt, ViewChainage, ViewSCurve, ViewResource, ViewCompare];

const store = {
  model: null, modelName: '', baseline: null, baselineName: '',
  scope: null, view: 'command',
  win: { from: 0, to: 0, preset: 'back4w' },
  tlFilter: null,
  d: {},
  listeners: new Set(),
  on(fn) { this.listeners.add(fn); },
  emit() { for (const fn of this.listeners) fn(); },
  set(patch) { Object.assign(this, patch); this.emit(); },

  recompute() {
    const m = this.model;
    if (!m) { this.d = {}; return; }
    this.d = {
      evm: computeEVM(m),
      dcma: runAllChecks(m, { baseline: this.baseline }),
      rollup: rollupWBS(m),
      oos: findOutOfSequence(m),
      demand: resourceDemand(m, 'week'),
      cmp: this.baseline ? compareModels(m, this.baseline) : null,
      report: windowReport(m, this.win.from, this.win.to),
      integrity: updateIntegrity(m),
      bands: floatBands(m),
    };
  },

  // ---- shared reporting window ----
  planSpan() {
    let t0 = Infinity, t1 = 0;
    for (const t of this.model.tasks) {
      if (t.targetStart !== undefined) t0 = Math.min(t0, t.targetStart);
      if (t.targetEnd !== undefined) t1 = Math.max(t1, t.targetEnd);
      if (t.actEnd !== undefined) t1 = Math.max(t1, t.actEnd);
    }
    return [dayFloor(t0), dayFloor(t1)];
  },
  setWindow(from, to, preset = 'custom') {
    this.win = { from: dayFloor(from), to: dayFloor(to), preset };
    if (this.model) this.d.report = windowReport(this.model, this.win.from, this.win.to);
    this.emit();
  },
  setWindowPreset(preset) {
    const m = this.model;
    if (!m) return;
    const dd = dayFloor(m.dataDate ?? Date.now());
    const back = (days) => this.setWindow(dd - days * DAY_MS, dd, preset);
    const fwd = (days) => this.setWindow(dd + DAY_MS, dd + days * DAY_MS, preset);
    switch (preset) {
      case 'back1w': return back(7);
      case 'back2w': return back(14);
      case 'back4w': return back(28);
      case 'month': {
        const d = new Date(dd);
        return this.setWindow(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1),
          Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0), preset);
      }
      case 'next2w': return fwd(14);
      case 'next4w': return fwd(28);
      case 'next6w': return fwd(42);
      case 'full': {
        const [a, b] = this.planSpan();
        return this.setWindow(a, b, preset);
      }
    }
  },
  stepWindow(dir) {
    const len = this.win.to - this.win.from + DAY_MS;
    this.setWindow(this.win.from + dir * len, this.win.to + dir * len, 'custom');
  },
  getLookahead(from, to) {
    return buildLookahead(this.model, from, to);
  },

  loadCurrent(text, name) {
    this.model = buildModel(parseXER(text));
    this.modelName = name;
    this.scope = null;
    this.tlFilter = null;
    const dd = this.model.dataDate;
    if (dd !== undefined) this.win = { from: dayFloor(dd) - 28 * DAY_MS, to: dayFloor(dd), preset: 'back4w' };
    else { const [a, b] = this.planSpan(); this.win = { from: a, to: b, preset: 'full' }; }
    this.recompute();
    this.emit();
  },
  loadBaseline(text, name) {
    this.baseline = buildModel(parseXER(text));
    this.baselineName = name;
    this.recompute();
    this.emit();
  },
  useDemo() { this.loadCurrent(DEMO_XER, DEMO_NAME + ' (demo)'); },
  useDemoBaseline() { this.loadBaseline(BASELINE_XER, BASELINE_NAME + ' (demo)'); },

  pickFile(kind) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xer,text/plain';
    input.addEventListener('change', () => {
      const f = input.files[0];
      if (!f) return;
      f.text().then((text) => {
        try {
          kind === 'baseline' ? this.loadBaseline(text, f.name) : this.loadCurrent(text, f.name);
        } catch (err) {
          alert(`Could not parse ${f.name}: ${err.message}`);
        }
      });
    });
    input.click();
  },
};

// The drifting star field behind everything — pure decoration, drawn once
// (static) for reduced-motion users, and never load-bearing for layout.
function mountStarfield(canvas) {
  const ctx = canvas.getContext('2d');
  let stars = [];
  const seed = (w, h) => {
    stars = [];
    const n = Math.round((w * h) / 11000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 0.3 + Math.random() * 1.1,
        v: 0.008 + Math.random() * 0.03,       // drift px/frame (parallax by size)
        p: Math.random() * Math.PI * 2,         // twinkle phase
        hue: Math.random() < 0.12 ? '139,123,255' : Math.random() < 0.3 ? '110,231,226' : '223,231,242',
      });
    }
  };
  const size = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed(innerWidth, innerHeight);
  };
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0;
  const frame = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    t += 0.016;
    for (const s of stars) {
      if (!still) { s.x -= s.v * s.r; if (s.x < -2) s.x = innerWidth + 2; }
      const tw = still ? 0.75 : 0.55 + 0.45 * Math.sin(t * 0.8 + s.p);
      ctx.fillStyle = `rgba(${s.hue},${(0.5 * tw * s.r).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  };
  size();
  window.addEventListener('resize', size);
  frame();
}

function renderSidebar(shell) {
  const groups = [];
  for (const v of VIEWS) {
    let g = groups.find((x) => x.name === v.group);
    if (!g) { g = { name: v.group, views: [] }; groups.push(g); }
    g.views.push(v);
  }
  const nav = shell.querySelector('.sidebar');
  nav.innerHTML = `
    <div class="brand"><i></i><b>PRISM</b><span>DEEP FIELD</span></div>
    ${groups.map((g) => `
      <div class="navgroup">
        <h3>${esc(g.name)}</h3>
        <div class="navlist">
          <span class="nav-indicator"></span>
          ${g.views.map((v) => `<button class="navitem" data-view="${v.id}">${esc(v.title)}</button>`).join('')}
        </div>
      </div>`).join('')}`;
  nav.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
    location.hash = '#/' + b.dataset.view;
    shell.classList.remove('drawer-open');
  }));
}

function syncNav(shell) {
  shell.querySelectorAll('.navlist').forEach((list) => {
    const ind = list.querySelector('.nav-indicator');
    const active = list.querySelector(`[data-view="${store.view}"]`);
    list.querySelectorAll('.navitem').forEach((b) => b.classList.toggle('active', b.dataset.view === store.view));
    if (active) {
      ind.style.opacity = '1';
      ind.style.top = active.offsetTop + 6 + 'px';
      ind.style.height = active.offsetHeight - 12 + 'px';
    } else {
      ind.style.opacity = '0';
    }
  });
}

function renderHeader(shell) {
  const view = VIEWS.find((v) => v.id === store.view) || VIEWS[0];
  const chip = store.model && view.chip ? view.chip(store) : '';
  shell.querySelector('.header').innerHTML = `
    <button class="hamburger" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="crumb">PRISM / ${esc(view.group)}<b>${esc(view.title)}</b></div>
    ${chip ? `<span class="chip">${chip}</span>` : ''}
    <span class="spacer"></span>
    <button class="btn small" data-act="baseline">Load baseline…</button>
    <button class="btn small primary" data-act="load">Load .xer…</button>`;
  shell.querySelector('.hamburger').addEventListener('click', () => shell.classList.toggle('drawer-open'));
  shell.querySelector('[data-act="load"]').addEventListener('click', () => store.pickFile('current'));
  shell.querySelector('[data-act="baseline"]').addEventListener('click', () => store.pickFile('baseline'));
}

function renderView(shell) {
  const el = shell.querySelector('.view');
  const view = VIEWS.find((v) => v.id === store.view) || VIEWS[0];
  el.classList.remove('view'); // retrigger settle animation
  void el.offsetWidth;
  el.classList.add('view');
  if (!store.model) {
    el.innerHTML = `<div class="empty" style="margin-top:40px">
      <h3>No schedule loaded</h3>
      <p>Load a Primavera P6 .xer export, or explore the bundled demo project.</p>
      <p style="margin-top:14px"><button class="btn" data-open>Load .xer…</button>
      <button class="btn primary" data-demo>Open demo project</button></p></div>`;
    el.querySelector('[data-demo]').addEventListener('click', () => store.useDemo());
    el.querySelector('[data-open]').addEventListener('click', () => store.pickFile('current'));
    return;
  }
  view.render(el, store);
}

function boot(root = document.body) {
  root.innerHTML = `
    <canvas class="stars" aria-hidden="true"></canvas>
    <div class="shell">
      <button class="scrim" aria-label="Close menu" tabindex="-1"></button>
      <nav class="sidebar" aria-label="Views"></nav>
      <div class="main">
        <header class="header"></header>
        <main class="view"></main>
      </div>
    </div>`;
  const shell = root.querySelector('.shell');
  mountStarfield(root.querySelector('canvas.stars'));
  renderSidebar(shell);
  shell.querySelector('.scrim').addEventListener('click', () => shell.classList.remove('drawer-open'));

  const applyHash = () => {
    const id = (location.hash || '').replace(/^#\//, '') || 'command';
    if (VIEWS.some((v) => v.id === id)) store.view = id;
    closeModal();
    renderHeader(shell);
    renderView(shell);
    syncNav(shell);
  };
  window.addEventListener('hashchange', applyHash);
  store.on(() => { renderHeader(shell); renderView(shell); syncNav(shell); });

  store.useDemo(); // demo loads instantly; "Load .xer" replaces it
  applyHash();
}

boot(document.getElementById('prism-root'));

})();
</script>
